[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-chemistry-video"
version = "0.1.0"
description = "Educational chemistry video generation — architecture skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4", "celery[redis]>=5.4,<6",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1", "boto3>=1.35,<2",
]

[project.optional-dependencies]
visuals = ["rdkit", "pillow>=11,<13"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
