services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chemistry_video
      POSTGRES_USER: chemistry
      POSTGRES_PASSWORD: chemistry_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemistry -d chemistry_video"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
